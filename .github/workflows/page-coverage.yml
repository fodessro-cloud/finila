name: Kontrola úplnosti stránok firiem

# Weekly check (Lub 2026-11-06) of which parts of the company page template every company fills:
# price, sector, official annual figures, history, description, outlook, reports, announcements.
# Builds the pages in a temporary folder (nothing is uploaded) and commits data/page-coverage.md.
on:
  schedule:
    - cron: '30 4 * * 6'   # Saturdays 04:30 UTC, before the weekly Radar and data check
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pages without uploading and count what each page shows
        env:
          FINILA_NEW_SLUGS: '1'
        run: python scripts/build-stock-pages.py . "$RUNNER_TEMP/site"
      - name: Commit the report
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/page-coverage.md data/page-coverage.json
          git diff --cached --quiet || git commit -m "Update company page coverage [data refresh]"
          git pull --rebase -X theirs || true
          git push
