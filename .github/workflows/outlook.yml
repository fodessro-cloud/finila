name: Výhľady a backlog firiem

# Quotes outlook, mid-term targets and order backlog word for word from each company's newest ESEF report
# into data/outlook.json, used by the company pages. Reports are cached per report.
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['scripts/data/outlook.py', '.github/workflows/outlook.yml']
  schedule:
    - cron: '20 4 * * *'   # daily 04:20 UTC, before the page build at 05:45
  workflow_dispatch:
    inputs:
      limit:
        description: 'Test: only this many of the largest companies (empty = all)'
        required: false

permissions:
  contents: write

concurrency:
  group: outlook
  cancel-in-progress: false

jobs:
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quote outlook and backlog from the newest report
        env:
          FINILA_BUDGET_MIN: '320'
          FINILA_LIMIT: ${{ inputs.limit || (github.event_name == 'push' && '60' || '') }}
        run: |
          set -o pipefail
          python scripts/data/outlook.py 2>&1 | tee data/outlook.log || { echo "::error::outlook: $(tail -3 data/outlook.log | tr '\n' ' ')"; exit 1; }
      - name: Commit results
        if: always()
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/outlook.json data/cache/outlook.json data/outlook.log
          git diff --cached --quiet || git commit -m "Update company outlook quotes [data refresh]"
          git pull --rebase -X theirs || true
          git push
