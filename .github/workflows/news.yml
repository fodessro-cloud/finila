name: Oznámenia firiem z búrz

# Official company announcements (Nasdaq Nordic, Oslo Børs): news lines and the newest quarterly report
# quoted word for word, into data/news.json for the company pages.
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['scripts/data/news.py', '.github/workflows/news.yml']
  schedule:
    - cron: '15 6,8,11,15 * * 1-5'   # after the morning report wave (07:00-08:30 CET) and during the day
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to look'
        required: false

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - name: Read announcements
        env:
          FINILA_NEWS_DAYS: ${{ inputs.days || '14' }}
        run: |
          set -o pipefail
          python scripts/data/news.py 2>&1 | tee data/news.log || { echo "::error::news: $(tail -3 data/news.log | tr '\n' ' ')"; exit 1; }
      - name: Commit results
        if: always()
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/news.json data/cache/news.json data/news.log
          git diff --cached --quiet || git commit -m "Update company announcements [data refresh]"
          for wait in 0 10 30 60; do sleep $wait; git pull --rebase -X theirs && git push && break; done
