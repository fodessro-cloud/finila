name: Probe a public source (dev)

# Prints what a public page looks like from GitHub Actions (the dev container cannot reach some hosts).
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: STORI service endpoints (FSMA, Belgium)
        run: |
          UA='FINILA data refresh (finila.com)'
          curl -sSL -A "$UA" -m 60 https://www.fsma.be/modules/custom/fsma_tools/modules/js/hook-in.js -o h.js
          wc -c h.js
          grep -oE '.{0,300}[Ss]tori.{0,600}' h.js | head -20
          echo "=== baseURL"
          grep -oE '.{0,200}baseURL.{0,200}' h.js | head -10
