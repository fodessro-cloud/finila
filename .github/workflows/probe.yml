name: Probe a public source (dev)

# Prints what a public page looks like from GitHub Actions (the dev container cannot reach some hosts).
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: STORI script (FSMA, Belgium)
        run: |
          UA='FINILA data refresh (finila.com)'
          curl -sSL -A "$UA" -m 60 https://www.fsma.be/modules/custom/fsma_tools/modules/js/fsma_stori.js -o s.js
          wc -c s.js
          echo "=== URLs / endpoints"
          grep -oE '["'"'"'`][^"'"'"'` ]*(/api/|/stori|json|ajax|/en/|/fr/|/nl/|https?://)[^"'"'"'` ]*["'"'"'`]' s.js | sort -u | head -80
          echo "=== fetch/axios calls"
          grep -oE '(fetch|axios[.a-z]*|\$http[.a-z]*|XMLHttpRequest|open)\([^)]{0,200}\)' s.js | head -40
          echo "=== head"
          head -c 6000 s.js
