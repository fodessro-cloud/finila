name: Test backlog v ESEF
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['scripts/data/probe_backlog.py', '.github/workflows/probe-backlog.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/data/probe_backlog.py 2>&1 | tee probe.log; tail -3 probe.log | while read l; do echo "::notice::$l"; done
