name: Test backlog a výhľadov z ESEF

on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['scripts/data/probe_backlog.py', '.github/workflows/probe-backlog.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/data/probe_backlog.py
