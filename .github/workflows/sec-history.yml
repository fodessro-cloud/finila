name: Annual figures from the SEC for European companies

# Reads 10-K / 20-F annual figures from data.sec.gov for European companies without ESEF reports that also
# file in the US (scripts/data/sec_history.py) into data/sec-history.json, used by the company pages.
on:
  push:
    branches: [claude/project-thread-z7m788]
    paths: ['scripts/data/sec_history.py', '.github/workflows/sec-history.yml']
  schedule:
    - cron: '50 2 * * 1'   # Mondays 02:50 UTC, before the page build
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sec-history
  cancel-in-progress: false

jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read 10-K and 20-F figures from the SEC
        run: |
          set -o pipefail
          python scripts/data/sec_history.py 2>&1 | tee data/sec-history.log || { echo "::error::sec: $(tail -3 data/sec-history.log | tr '\n' ' ')"; exit 1; }
      - name: Commit results
        if: always()
        run: |
          git config user.name "finila-data-bot"
          git config user.email "finila-data-bot@users.noreply.github.com"
          git add data/sec-history.json data/sec-history.log
          git diff --cached --quiet || git commit -m "Update SEC annual figures [data refresh]"
          git pull --rebase -X theirs || true
          git push
